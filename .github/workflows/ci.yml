name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Testy jádra (AgentProfesor.Core – běží i mimo Windows)
        run: dotnet test tests/AgentProfesor.Core.Tests -c Release

      - name: Integrační testy dashboard API
        run: dotnet test tests/AgentProfesor.Dashboard.Tests -c Release

      - name: Build demo nástroje (ať nezrezaví)
        run: dotnet build tools/VersionDemo -c Release
